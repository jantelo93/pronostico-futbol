name: Actualizar pronosticos

on:
  schedule:
    - cron: '0 11,17,23,5 * * *'   # 07:00, 13:00, 19:00 y 01:00 hora de Bolivia
  workflow_dispatch:           # tambien permite ejecutarlo a mano desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Ejecutar el modelo
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python actualizar.py

      - name: Guardar el historial de pronosticos
        run: |
          if [ -n "$(git status --porcelain historial.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add historial.json
            git commit -m "Historial actualizado: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash origin main || true
            git push
            echo "Historial guardado en el repositorio."
          else
            echo "El historial no cambio: no hay nada que guardar."
          fi

      - name: Preparar la publicacion
        run: |
          mkdir -p _publicar
          cp index.html _publicar/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publicar

      - name: Publicar
        uses: actions/deploy-pages@v4
